name: Makefile CI

on:
  push:
    tags: [ "v*" ]        # 仅打版本 tag 时构建并发布 Release
  pull_request:
    branches: [ "main" ]  # PR 仍做测试与构建检查
  workflow_dispatch:      # 支持在 Actions 页面手动触发

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # 拉取完整历史与 tag, 供 git describe 生成版本号

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Install PC/SC dev libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y pkg-config libpcsclite-dev

    - name: Test
      run: go test ./...

    - name: Build Windows release
      run: make build-windows

    - name: Build Linux release
      run: make build-linux

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bluetag-go-binaries
        path: |
          bin/bluetag-go-windows-*.exe
          bin/bluetag-go-linux-*
        if-no-files-found: error

  release:
    # 推送 v* tag 时: 把构建产物发布到 GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 需要; build job 仍保持默认只读
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bluetag-go-binaries
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
